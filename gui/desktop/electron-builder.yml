# electron-builder 配置 — 打包 Windows NSIS 安装包
#
# 输出：release/AutoAttendance-Setup-<version>.exe
# 安装后目录结构：
#   <Install>\AutoAttendance.exe
#   <Install>\resources\app\                     # Electron 应用（asar 已关闭，见下方 asar: false）
#   <Install>\resources\backend\                # Python 后端源码（运行需系统装 Python）
#
# 注意：当前为"源码方案"，用户机器必须装 Python 3.10+ 和 pip 依赖。
#       PyInstaller 二进制方案见 P2-4 升级。

appId: com.aas.desktop
productName: AutoAttendance
copyright: Copyright © 2026 自动打卡系统

directories:
  output: release
  buildResources: electron

# Electron 内打包的文件（asar 中）
files:
  - dist/**/*
  - electron/main.cjs
  - electron/preload.cjs
  - electron/tray-icon.png
  - electron/tray-icon@2x.png
  - package.json
  - "!**/*.map"
  - "!**/.DS_Store"

# 项目根的 Python 后端，作为 extraResources 放到 resources/backend/
extraResources:
  - from: ../../
    to: backend
    filter:
      - main.py
      - start.py
      - watchdog.py
      - requirements.txt
      - .env.example
      - modules/**/*
      - templates/**/*
      - bin/**/*            # 内置网络加速：mihomo 内核 + geo 数据（由 scripts/fetch-mihomo.ps1 准备）
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/venv/**"
      - "!**/gui/**"
      - "!**/.git/**"
      - "!**/punch_records/**"
      - "!**/screenshots/**"
      - "!**/logs/**"
      - "!**/release/**"

# 关闭 asar：electron-builder@26 + Electron 31 在打包末尾为 exe 写入 ASAR 完整性校验
# (addWinAsarIntegrity → pe-library NtExecutable.generate) 时崩溃：
#   RangeError: Array buffer allocation failed
# 关闭后应用以 resources/app/ 文件夹形式打包，功能不变（main.cjs 用 __dirname / process.resourcesPath
# 定位，不依赖 app.asar）。如需恢复 asar，将下行改回 true 并取消下方 asarUnpack 注释。
asar: false
# asar 关闭后 asarUnpack 无意义（文件已是普通目录），保留备查：
# asarUnpack:
#   - electron/tray-icon.png
#   - electron/tray-icon@2x.png

win:
  target:
    - target: nsis
      arch: [x64]
  icon: electron/app-icon.png
  artifactName: AutoAttendance-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 自动打卡系统
  installerLanguages:
    - zh_CN
  language: '2052'

# 不签名 — 用户自己机器跑，无需代码签名
forceCodeSigning: false
